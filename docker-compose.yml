services:
  postgres:
    image: postgres:17
    container_name: overvu-postgres
    environment:
      POSTGRES_DB: overvu
      POSTGRES_USER: overvu
      POSTGRES_PASSWORD: overvu
    ports:
      - "5432:5432"
    volumes:
      - overvu-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overvu"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: overvu-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/overvu
      SPRING_DATASOURCE_USERNAME: overvu
      SPRING_DATASOURCE_PASSWORD: overvu
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: overvu-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  overvu-data: