services:
  postgres:
    image: postgres:17
    container_name: personal-life-os-postgres
    environment:
      POSTGRES_DB: personal_life_os
      POSTGRES_USER: personal_life_os
      POSTGRES_PASSWORD: personal_life_os
    ports:
      - "5432:5432"
    volumes:
      - personal-life-os-data:/var/lib/postgresql/data

volumes:
  personal-life-os-data: